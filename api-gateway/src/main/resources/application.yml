server:
  port: 8080

spring:
  application:
    name: api-gateway

gateway:
  services:
    users: ${USERS_SERVICE_URL:http://localhost:8081}
    questions: ${QUESTIONS_SERVICE_URL:http://localhost:8082}
    validation: ${VALIDATION_SERVICE_URL:http://localhost:8083}
    lifecycle: ${LIFECYCLE_SERVICE_URL:http://localhost:8084}
    review: ${REVIEW_SERVICE_URL:http://localhost:8085}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
    audit: ${AUDIT_SERVICE_URL:http://localhost:8087}

keycloak:
  jwks-url: ${KEYCLOAK_JWKS_URI:http://localhost:8089/realms/saberpro/protocol/openid-connect/certs}
  issuer-url: ${KEYCLOAK_ISSUER_URI:http://localhost:8089/realms/saberpro}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
