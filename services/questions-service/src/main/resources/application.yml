server:
  port: 8082

spring:
  application:
    name: questions-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/questions_db;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

services:
  validation:
    url: ${SERVICES_VALIDATION_URL:${VALIDATION_SERVICE_URL:http://localhost:8083}}
  lifecycle:
    url: ${SERVICES_LIFECYCLE_URL:${LIFECYCLE_SERVICE_URL:http://localhost:8084}}

keycloak:
  jwks-url: ${KEYCLOAK_JWKS_URI:http://localhost:8089/realms/saberpro/protocol/openid-connect/certs}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html



management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
